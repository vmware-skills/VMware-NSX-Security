[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmware-nsx-security"
version = "1.8.11"
description = "VMware NSX DFW microsegmentation and security: distributed firewall, security groups, tags, traceflow, IDPS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wei Zhou", email = "wei-wz.zhou@broadcom.com" }]
keywords = ["vmware", "nsx", "nsx-t", "dfw", "microsegmentation", "firewall", "mcp", "ai-ops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "mcp[cli]>=1.10,<2.0",
    "vmware-policy>=1.8.8,<2.0",
]

[project.scripts]
vmware-nsx-security = "vmware_nsx_security.cli:app"
vmware-nsx-security-mcp = "vmware_nsx_security.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["vmware_nsx_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "capability: Capability evals — scored trends, not pass/fail gates. Excluded from the default run (they measure quality, so <100% is expected and must not read as a broken build). Run them with: pytest -m capability",
]
addopts = "-m 'not capability'"

[project.urls]
Homepage = "https://github.com/vmware-skills/VMware-NSX-Security"
Repository = "https://github.com/vmware-skills/VMware-NSX-Security"
Issues = "https://github.com/vmware-skills/VMware-NSX-Security/issues"
Changelog = "https://github.com/vmware-skills/VMware-NSX-Security/blob/main/RELEASE_NOTES.md"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
